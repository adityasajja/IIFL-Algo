[project]
name = "atr"
version = "0.1.0"
description = "Algorithmic trading backend — backtest engine, risk, and IIFL Capital execution"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "loguru>=0.7",
    "numpy>=2.1",
    "pandas>=2.2",
    "paho-mqtt>=2.1",
    "psycopg[binary]>=3.2",
    "pyarrow>=18.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    "sqlalchemy>=2.0",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
atr = "atr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atr"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI dependency defaults are idiomatic
    "E501",   # line length is ruff-format's job, not a logic error
    "UP042",  # (str, Enum) is deliberate: json/pydantic-safe enums
    "B027",   # optional lifecycle hooks in the Strategy ABC are intentional
]
