[project]
name = "atr"
version = "0.1.0"
description = "Algorithmic trading backend — backtest engine, risk, and IIFL Capital execution"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "cryptography>=43",
    # Imported by atr/analytics/duck_engine.py and atr/api/stream.py but previously undeclared.
    "duckdb>=1.0",
    "fastapi>=0.115",
    "httpx[http2]>=0.28",
    "loguru>=0.7",
    "numpy>=2.5",
    "orjson>=3.10",
    "pandas>=3.0",
    "paho-mqtt>=2.1",
    # Imported by atr/api/stream.py, atr/data/history.py and atr/signals/engine.py
    # but previously undeclared — those paths only worked because polars happened
    # to be present in the developer's environment.
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=18.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    "sqlalchemy>=2.0",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.32",
    "pandas-ta-classic>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
# CUDA build of PyTorch for the GPU sweeps (`atr gpu ...`). Nothing in the app's
# request path needs it; it is a separate group so it can be dropped with
# `uv sync --no-group gpu` on a machine without an NVIDIA GPU.
gpu = [
    "torch>=2.14",
]

[project.scripts]
atr = "atr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atr"]

[tool.uv]
default-groups = ["dev", "gpu"]

# PyPI's Windows torch wheel is CPU-only; the CUDA builds live on PyTorch's own index.
# cu132 runs on any driver that supports CUDA 13.2 or newer.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI dependency defaults are idiomatic
    "E501",   # line length is ruff-format's job, not a logic error
    "UP042",  # (str, Enum) is deliberate: json/pydantic-safe enums
    "B027",   # optional lifecycle hooks in the Strategy ABC are intentional
]
